[project]
name = "factextract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nusaturn", email = "skaturanus@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.3.1",
    "falkordblite>=0.10.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.63.0",
    "xxhash>=4.0.1",
]

[project.scripts]
factextract = "factextract:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
